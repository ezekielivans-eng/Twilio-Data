<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Twilio WhatsApp Analytics{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <span class="nav-logo">&#9993;</span>
            Twilio WhatsApp Analytics
        </div>
        <div class="nav-links">
            <a href="/dashboard" class="nav-link {% if request.path in ['/', '/dashboard'] %}active{% endif %}">Dashboard</a>
            <a href="/subaccounts" class="nav-link {% if '/subaccounts' in request.path %}active{% endif %}">Sub-Accounts</a>
            <a href="/templates" class="nav-link {% if request.path == '/templates' %}active{% endif %}">Templates</a>
            <a href="/errors" class="nav-link {% if request.path == '/errors' %}active{% endif %}">Errors</a>
            <a href="/billing" class="nav-link {% if request.path == '/billing' %}active{% endif %}">Billing</a>
        </div>
    </nav>

    <div class="container">
        <div class="date-picker">
            <label>From (UTC): <input type="date" id="dateFrom"></label>
            <label>To (UTC): <input type="date" id="dateTo"></label>
            <div class="account-filter-wrapper" style="position:relative;">
                <label style="font-size:0.85rem;font-weight:600;color:#555;">Account:</label>
                <button type="button" id="accountFilterBtn" class="filter-select" style="min-width:180px;text-align:left;cursor:pointer;display:flex;align-items:center;justify-content:space-between;">
                    <span id="accountFilterLabel">All Accounts</span>
                    <span style="font-size:0.6rem;margin-left:0.5rem;">&#9660;</span>
                </button>
                <div id="accountFilterDropdown" class="account-dropdown" style="display:none;">
                    <div style="padding:0.5rem;border-bottom:1px solid #eee;">
                        <button type="button" id="acctSelectAll" class="btn btn-sm" style="margin-right:0.25rem;">All</button>
                        <button type="button" id="acctSelectNone" class="btn btn-sm">None</button>
                    </div>
                    <div id="accountCheckboxes" class="account-checkbox-list"></div>
                </div>
            </div>
            <button id="applyDates" class="btn btn-primary">Apply</button>
            <button id="refreshCache" class="btn btn-secondary">Refresh Data</button>
            <label class="auto-refresh-label">
                <input type="checkbox" id="autoRefresh">
                Auto
                <select id="autoRefreshInterval" class="filter-select" style="min-width:auto;padding:0.2rem 0.4rem;font-size:0.75rem;">
                    <option value="5">5m</option>
                    <option value="10" selected>10m</option>
                    <option value="15">15m</option>
                </select>
            </label>
            <span id="lastUpdated" class="last-updated"></span>
        </div>

        <div id="loading" class="loading-overlay" style="display:none;">
            <div class="spinner"></div>
            <p>Loading data from Twilio...</p>
        </div>

        {% block content %}{% endblock %}
    </div>

    <script>
        window.API_TIMEOUT = 120000;
        // Date picker logic shared across all pages
        (function() {
            const params = new URLSearchParams(window.location.search);
            const today = new Date().toISOString().split('T')[0];

            const dateFrom = document.getElementById('dateFrom');
            const dateTo = document.getElementById('dateTo');

            dateFrom.value = params.get('date_from') || today;
            dateTo.value = params.get('date_to') || today;

            document.getElementById('applyDates').addEventListener('click', () => {
                const from = new Date(dateFrom.value);
                const to = new Date(dateTo.value);
                const diffDays = Math.round((to - from) / 86400000);
                if (diffDays < 0 || diffDays > 90) {
                    alert('Date range must be between 0 and 90 days.');
                    return;
                }
                sessionStorage.clear();
                const url = new URL(window.location);
                url.searchParams.set('date_from', dateFrom.value);
                url.searchParams.set('date_to', dateTo.value);
                window.location = url;
            });

            document.getElementById('refreshCache').addEventListener('click', async () => {
                if (!confirm('Clear cached data and reload from Twilio?')) return;
                sessionStorage.clear();
                await fetch('/api/cache/clear', {method: 'POST'});
                window.location.reload();
            });

            // Populate account filter multi-select
            const acctFilterBtn = document.getElementById('accountFilterBtn');
            const acctFilterDropdown = document.getElementById('accountFilterDropdown');
            const acctCheckboxes = document.getElementById('accountCheckboxes');
            const acctFilterLabel = document.getElementById('accountFilterLabel');
            let allAccounts = []; // [{sid, friendly_name}]
            let mainAccountSid = '';

            // Toggle dropdown
            acctFilterBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                acctFilterDropdown.style.display = acctFilterDropdown.style.display === 'none' ? 'flex' : 'none';
            });
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.account-filter-wrapper')) acctFilterDropdown.style.display = 'none';
            });

            function updateAccountLabel() {
                const checked = [...acctCheckboxes.querySelectorAll('input:checked')].map(cb => cb.value);
                const total = allAccounts.length;
                if (checked.length === 0) {
                    acctFilterLabel.textContent = 'None Selected';
                } else if (checked.length === total) {
                    acctFilterLabel.textContent = 'All Accounts';
                } else if (total - checked.length <= 2) {
                    const unchecked = allAccounts.filter(a => !checked.includes(a.sid)).map(a => a.friendly_name);
                    acctFilterLabel.textContent = 'All except ' + unchecked.join(', ');
                } else {
                    acctFilterLabel.textContent = checked.length + ' of ' + total + ' accounts';
                }
            }

            function onAccountFilterChange() {
                updateAccountLabel();
                sessionStorage.clear();
                if (window._onAccountFilterChange) window._onAccountFilterChange();
            }

            const accountsReady = fetch('/api/accounts').then(r => r.json()).then(data => {
                mainAccountSid = data.main_sid || '';
                allAccounts = data.accounts || [];
                const urlExclude = new Set((params.get('exclude_accounts') || '').split(',').filter(Boolean));

                allAccounts.forEach(a => {
                    const label = document.createElement('label');
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.value = a.sid;
                    cb.checked = !urlExclude.has(a.sid);
                    cb.addEventListener('change', debounce(onAccountFilterChange, 400));
                    label.appendChild(cb);
                    label.appendChild(document.createTextNode(' ' + a.friendly_name));
                    acctCheckboxes.appendChild(label);
                });
                updateAccountLabel();
            }).catch(() => {});

            // Select All / None buttons
            document.getElementById('acctSelectAll').addEventListener('click', () => {
                acctCheckboxes.querySelectorAll('input').forEach(cb => cb.checked = true);
                onAccountFilterChange();
            });
            document.getElementById('acctSelectNone').addEventListener('click', () => {
                acctCheckboxes.querySelectorAll('input').forEach(cb => cb.checked = false);
                onAccountFilterChange();
            });

            // Pages can await this before their initial load
            window.accountsReady = accountsReady;

            // Expose helper for JS files
            window.getAccountFilterParam = () => {
                const checked = [...acctCheckboxes.querySelectorAll('input:checked')].map(cb => cb.value);
                const total = allAccounts.length;
                if (checked.length === 0) return '&exclude_accounts=__all__';
                if (checked.length === total) return '';
                const excluded = allAccounts.filter(a => !checked.includes(a.sid)).map(a => a.sid);
                return '&exclude_accounts=' + excluded.join(',');
            };
            window.getDateParams = () => `date_from=${dateFrom.value}&date_to=${dateTo.value}`;
            window.csvFilename = (base) => `${base}_${dateFrom.value}_${dateTo.value}.csv`;
            window.showLoading = () => document.getElementById('loading').style.display = 'flex';
            window.hideLoading = () => document.getElementById('loading').style.display = 'none';
            window.showError = (message) => {
                const el = document.getElementById('loading');
                el.innerHTML = '<p style="color:#dc3545;font-weight:bold;margin-bottom:1rem;">Error: ' + message + '</p>' +
                    '<button class="btn btn-primary" onclick="window.location.reload()">Retry</button>';
                el.style.display = 'flex';
            };
            window.showWarning = (messages) => {
                const existing = document.querySelector('.warning-banner');
                if (existing) existing.remove();
                const banner = document.createElement('div');
                banner.className = 'warning-banner';
                banner.style.cssText = 'background:#fff3cd;color:#856404;border:1px solid #ffc107;border-radius:6px;padding:12px 16px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;';
                const text = Array.isArray(messages) ? messages.join('; ') : messages;
                banner.innerHTML = '<span>Warning: ' + escapeHtml(text) + '</span><button onclick="this.parentElement.remove()" style="background:none;border:none;font-size:18px;cursor:pointer;color:#856404;">&times;</button>';
                const container = document.querySelector('.container');
                container.insertBefore(banner, container.children[1]);
            };
            window.getStatusFilterValues = () => {
                const container = document.getElementById('statusFilter');
                if (!container) return '';
                const checked = [...container.querySelectorAll('input[type="checkbox"]:checked')].map(cb => cb.value);
                return checked.join(',');
            };
            window.safeCacheSet = (key, data) => {
                try { sessionStorage.setItem(key, JSON.stringify(data)); } catch(e) { /* quota exceeded */ }
            };
            window.escapeHtml = (str) => {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            };
            window.setLastUpdated = () => {
                const now = new Date();
                document.getElementById('lastUpdated').textContent =
                    'Updated ' + now.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
            };
            // Restore direction filter from URL
            const urlDirection = params.get('direction') || '';
            const dirEl = document.getElementById('directionFilter');
            if (dirEl && urlDirection) {
                dirEl.value = urlDirection;
            }

            // Restore status filter from URL
            const urlStatus = params.get('status') || '';
            if (urlStatus) {
                const statusSet = new Set(urlStatus.split(','));
                const container = document.getElementById('statusFilter');
                if (container) {
                    container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                        cb.checked = statusSet.has(cb.value);
                    });
                }
            }

            // Update URL with current filter state (no reload)
            window.updateURLFilters = () => {
                const url = new URL(window.location);
                // Direction
                const dir = document.getElementById('directionFilter')?.value || '';
                if (dir) url.searchParams.set('direction', dir);
                else url.searchParams.delete('direction');
                // Status
                const status = getStatusFilterValues();
                if (status) url.searchParams.set('status', status);
                else url.searchParams.delete('status');
                // Account
                url.searchParams.delete('account_sid');
                url.searchParams.delete('exclude_accounts');
                const excludeParam = getAccountFilterParam();
                const match = excludeParam.match(/exclude_accounts=(.+)/);
                if (match) url.searchParams.set('exclude_accounts', match[1]);
                history.replaceState(null, '', url);
            };

            // Auto-refresh
            let autoRefreshTimer = null;
            const autoRefreshCb = document.getElementById('autoRefresh');
            const autoRefreshSel = document.getElementById('autoRefreshInterval');
            // Restore from localStorage
            if (localStorage.getItem('autoRefresh') === '1') {
                autoRefreshCb.checked = true;
                const savedMin = localStorage.getItem('autoRefreshMin');
                if (savedMin) autoRefreshSel.value = savedMin;
                startAutoRefresh();
            }
            function startAutoRefresh() {
                stopAutoRefresh();
                const minutes = parseInt(autoRefreshSel.value) || 10;
                autoRefreshTimer = setInterval(() => {
                    sessionStorage.clear();
                    fetch('/api/cache/clear', {method: 'POST'}).then(() => {
                        if (window._onAccountFilterChange) window._onAccountFilterChange();
                        else window.location.reload();
                    });
                }, minutes * 60 * 1000);
            }
            function stopAutoRefresh() {
                if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
            }
            autoRefreshCb.addEventListener('change', () => {
                if (autoRefreshCb.checked) {
                    localStorage.setItem('autoRefresh', '1');
                    localStorage.setItem('autoRefreshMin', autoRefreshSel.value);
                    startAutoRefresh();
                } else {
                    localStorage.removeItem('autoRefresh');
                    stopAutoRefresh();
                }
            });
            autoRefreshSel.addEventListener('change', () => {
                localStorage.setItem('autoRefreshMin', autoRefreshSel.value);
                if (autoRefreshCb.checked) startAutoRefresh();
            });

            // Safe Chart.js wrapper — prevents page breakage if canvas missing or Chart fails
            window.safeChart = (canvasId, config) => {
                try {
                    const canvas = document.getElementById(canvasId);
                    if (!canvas) { console.warn('Canvas not found:', canvasId); return null; }
                    return new Chart(canvas, config);
                } catch (e) {
                    console.error('Chart render failed for', canvasId, e);
                    return null;
                }
            };

            // Debounce — prevents rapid-fire calls (e.g. checkbox toggling)
            window.debounce = (fn, delay = 300) => {
                let timer;
                return (...args) => {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn(...args), delay);
                };
            };

            // Request deduplication — prevents duplicate in-flight requests
            window.fetchWithDedup = (() => {
                const inflight = {};
                return (url, opts) => {
                    const key = url + (opts ? JSON.stringify(opts) : '');
                    if (inflight[key]) return inflight[key];
                    inflight[key] = fetch(url, opts).finally(() => { delete inflight[key]; });
                    return inflight[key];
                };
            })();

            // Persistent warning for partial data (non-dismissible)
            window.showPartialDataWarning = (messages) => {
                const existing = document.querySelector('.partial-data-banner');
                if (existing) existing.remove();
                const banner = document.createElement('div');
                banner.className = 'partial-data-banner';
                banner.style.cssText = 'background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;border-radius:6px;padding:12px 16px;margin:10px 0;';
                const text = Array.isArray(messages) ? messages.join('; ') : messages;
                banner.innerHTML = '<strong>Partial data:</strong> ' + escapeHtml(text);
                const container = document.querySelector('.container');
                container.insertBefore(banner, container.children[1]);
            };

            window.exportCSV = (filename, headers, rows) => {
                const escape = (val) => {
                    const s = String(val == null ? '' : val);
                    return s.includes(',') || s.includes('"') || s.includes('\n')
                        ? '"' + s.replace(/"/g, '""') + '"' : s;
                };
                const csv = [headers.map(escape).join(',')]
                    .concat(rows.map(r => r.map(escape).join(',')))
                    .join('\n');
                const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                link.click();
                URL.revokeObjectURL(link.href);
            };
        })();
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
